# Настройки ruff для `python gmr.py check`: только правила, которые ловят
# ошибки (синтаксис, неизвестные имена, лишние импорты). Стиль не проверяется.
extend-exclude = ["archive"]

[lint]
# W605 — «\ » в обычной строке: Python предупреждает при каждом запуске (2026-10-01)
select = ["E4", "E7", "E9", "F", "W605"]
ignore = [
    "E402",  # импорт не в начале файла (program2.py: сначала путь к проекту)
    "E702",  # несколько команд в строке через «;» (models/)
    "E741",  # переменная с именем l
]
